<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주은 생일카페</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면 게임: 위 HUD → 가운데 탑뷰 도트 행성(#1203) → 아래 십자패드. 보라 우주 + 라벤더 행성, 의도적으로 단일 테마 */
:root{
  --space:#170d33; --space-2:#1e1040; --panel:#2b1d55;
  --cream:#fff7f0; --berry:#ff6f91; --berry-deep:#d94a72; --mint:#8ff0d2; --gold:#ffd166;
  --ink:#2a1f3d; --muted:#b3a5dc; --line:#46337a;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--cream);font-family:var(--body);font-size:15px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;flex-direction:column;gap:10px;max-width:1000px;margin:0 auto;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hud h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,28px);margin:0;letter-spacing:.5px;line-height:1.1}
.hud h1 span{color:var(--gold)}
.hud h1 small{display:block;font-size:12px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.hud-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.chip b{color:var(--mint);font-weight:400}
button{font-family:var(--display);font-size:15px;border:0;cursor:pointer;color:var(--ink);background:var(--cream);border-radius:8px;padding:10px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.ghost{background:var(--panel);color:var(--cream);border:1px solid var(--line)}
.stage{position:relative;flex:1 1 auto;min-height:300px;max-height:520px;border-radius:10px;overflow:hidden;border:3px solid var(--line);background:var(--space-2)}
#cv{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.enter{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c99a2e;white-space:nowrap}
.skip{position:absolute;right:10px;top:10px;font-size:13px;padding:6px 10px;background:rgba(23,13,51,.7);color:var(--cream);border:1px solid var(--line)}
/* 시작 패널 */
.start{position:absolute;inset:auto 0 0 0;padding:14px;display:flex;justify-content:center}
.start-card{background:rgba(23,13,51,.92);border:3px solid var(--line);border-radius:10px;padding:16px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.start-card h2{font-family:var(--display);font-weight:400;margin:0;font-size:24px;color:var(--gold)}
.start-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.start-card input{font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--space);color:var(--cream);width:100%}
.start-card .go{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c99a2e;font-size:17px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:6px;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--cream)}
.chat{display:flex;gap:6px;min-width:0}
.chat input{flex:1 1 auto;min-width:0;font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--cream)}
.chat input::placeholder{color:var(--muted)}
.chat.off input{opacity:.7}.chat.off button{opacity:.45;cursor:default}
.chat button{flex:none;background:var(--gold);color:var(--ink);padding:10px 12px}.chat .emo{background:var(--panel);border:2px solid var(--line);padding:8px 9px;font-size:16px}
.log{position:absolute;left:8px;top:8px;max-width:62%;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.lm{background:rgba(23,13,51,.78);color:#fff;font-size:12px;line-height:1.4;padding:3px 8px;border-radius:4px;overflow-wrap:anywhere}
.lm b{color:var(--gold);font-weight:400;font-family:var(--display)}.lm.me b{color:var(--mint)}
.gal,.mgal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ex{display:flex;flex-direction:column;gap:6px;background:none;padding:0;text-align:left;color:var(--ink);min-width:0}
.exf{display:block;background:#2a1f3d;padding:6px;border-radius:4px;box-shadow:inset 0 0 0 3px #ffd166,0 4px 0 #c99a2e}
.exf img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:2px}
.exf.big img{aspect-ratio:auto;max-height:60vh;object-fit:contain;background:#170d33}
.pl{display:flex;flex-direction:column;gap:2px;background:#fff;border:1.5px solid #ece2f2;border-radius:4px;padding:6px 8px;min-width:0}
.pl b{font-family:var(--display);font-weight:400;font-size:14px;overflow-wrap:anywhere}.pl i{font-style:normal;font-size:11px;color:#9a8db0}.pl small{font-size:12px;color:#5c4f73;overflow-wrap:anywhere}
.why{margin:0;font-size:16px;line-height:1.6;color:var(--ink);border-left:4px solid #ffd166;padding:4px 0 4px 12px;overflow-wrap:anywhere}
.sheet p.by{font-size:13px;color:#9a8db0}
.gwrap{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:3/4}
.gwrap canvas{width:100%;height:100%}
.gres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:8px;padding:12px}
.gres b{font-family:var(--display);font-weight:400;font-size:clamp(44px,14vw,64px);line-height:1;letter-spacing:2px}
.gres span{font-family:var(--display);font-size:15px;color:#fff}
.gres.win{background:rgba(23,13,51,.6)}.gres.win b{color:var(--gold);text-shadow:0 4px 0 #c99a2e,0 0 18px rgba(255,209,102,.6);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.gres.lose{background:rgba(23,13,51,.7)}.gres.lose b{color:#ffb3cf;font-size:clamp(34px,10vw,46px)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.gtoast{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--display);background:var(--gold);color:var(--ink);padding:6px 12px;border-radius:6px;white-space:nowrap}
.gtoast.go{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.dwrap{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto;overflow:hidden;border:2px solid #ece2f2;border-radius:8px;touch-action:none;background:#fff}
.dwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;border-radius:0}
.zl{font-family:var(--display);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.sheet p.zhint{font-size:12px;color:#9a8db0;text-align:center}
.mex{display:flex;flex-direction:column;gap:6px;background:none;padding:0;text-align:left;color:var(--ink);min-width:0}
.mf{display:block;background:#2a1f3d;padding:4px;border-radius:4px;box-shadow:inset 0 0 0 2px #8ff0d2}.mf img{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;background:#fff}
.pl b{font-size:13px}.pl small{font-size:11px}
.vw{position:relative;width:100%;max-width:340px;margin:0 auto;background:#170d33;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 3px #ffd166;touch-action:pan-y}
.vw img{position:absolute;left:6px;top:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.vw.px{box-shadow:inset 0 0 0 3px #8ff0d2}.vw.px img{image-rendering:pixelated}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:56px;padding:0;background:rgba(23,13,51,.6);color:#fff;font-size:16px;border-radius:6px}
.vnav.l{left:8px}.vnav.r{right:8px}
.vcount{text-align:center;font-size:12px;color:#9a8db0;font-variant-numeric:tabular-nums}
.whyh{font-family:var(--display);font-size:13px;color:var(--berry-deep)}
.booth9{position:relative;width:min(100%,calc(50vh * 9 / 16));aspect-ratio:9/16;margin:0 auto;background:#170d33;border-radius:6px;overflow:hidden}
.booth9 video{position:absolute;left:5.556%;top:3.125%;width:88.889%;height:79.167%;object-fit:cover;transform:scaleX(-1)}
.booth9 #pshot{position:absolute;inset:0;width:100%;height:100%}
.booth9 canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:0;background:transparent}
.stkwrap{width:min(100%,calc(52vh * 9 / 16));aspect-ratio:9/16;margin:0 auto;touch-action:none}
.stkwrap canvas{width:100%;height:100%;border-radius:6px}
.stk{padding:6px 8px}.stk img{width:32px;display:block;image-rendering:pixelated}
.ref{background:#fff;border:1.5px solid #ece2f2;border-radius:8px;padding:8px 12px}
.ref summary{font-family:var(--display);cursor:pointer;color:var(--ink)}
.refin{display:flex;gap:12px;align-items:center;margin-top:8px}
.refin img{width:96px;flex:none;border-radius:6px;background:#efe8fd}.refin img.px{image-rendering:pixelated;padding:6px}
.refin p{font-size:13px;margin:0}
/* 패드 */
.pad{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
.dpad button{background:var(--panel);color:var(--cream);border:2px solid var(--line);font-size:18px;padding:0;touch-action:none;border-radius:8px}
.dpad button.on,.dpad button:active{background:var(--line)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.hint{font-size:12px;color:var(--muted);line-height:1.5;min-width:0}
.hint b{color:var(--cream);font-weight:400;font-family:var(--display)}
/* 모달 */
.veil{position:fixed;inset:0;background:rgba(10,6,24,.75);display:flex;align-items:flex-end;justify-content:center;z-index:10;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--cream);color:var(--ink);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:14px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.x{background:#ece4f3;color:var(--ink);width:40px;height:40px;padding:0;border-radius:8px;font-size:18px;flex:none}
.sheet p{margin:0;line-height:1.55;color:#5c4f73}
.mission{font-family:var(--display);font-size:13px;color:var(--berry-deep);letter-spacing:.5px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet .primary{background:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.sheet .soft{background:#efe6f5;color:var(--ink)}
.sheet .sw.on{border-color:var(--ink)}
.sheet img.out{width:100%;border-radius:8px;display:block;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default;image-rendering:pixelated}
.save{font-size:13px;color:var(--berry-deep);text-align:center}
.sheet canvas{display:block;width:100%;border-radius:8px;touch-action:none;background:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5c4f73;flex:1 1 140px;min-width:0}
.sheet input,.sheet select,.sheet textarea{font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:8px;border:1.5px solid #e0d6ea;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
.gb{display:flex;flex-direction:column;gap:8px}
.note{background:#fff;border-radius:8px;padding:10px 12px;border:1.5px solid #ece2f2}
.note .who{font-family:var(--display);font-size:15px;color:var(--berry-deep)}
.note .tag{font-size:11px;color:#9a8db0;margin-left:6px}
.note .msg{margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
.stat{font-family:var(--display);font-variant-numeric:tabular-nums;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stat b{color:var(--berry-deep);font-weight:400}
.decode{font-family:var(--display);font-size:clamp(22px,7vw,30px);letter-spacing:4px;text-align:center;background:var(--space);color:var(--mint);border-radius:8px;padding:16px 10px;overflow-wrap:anywhere}
.decode i{font-style:normal;color:#4c3c88}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1.5px solid #ece2f2;border-radius:8px;padding:9px 12px}
.checks li span:last-child{font-family:var(--display);color:#9a8db0}
.checks li.ok span:last-child{color:#2a9d78}
.booth{position:relative;aspect-ratio:4/3;background:#170d33;border-radius:8px;overflow:hidden;border:3px solid var(--ink)}
.booth video,.booth canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;border-radius:0}
.booth video{transform:scaleX(-1)}.booth canvas{image-rendering:pixelated;pointer-events:none}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:72px;color:#fff;text-shadow:0 4px 0 var(--ink)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:fl .45s ease-out}@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.thumbs img,.thumbs span{width:100%;aspect-ratio:4/3;border-radius:6px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:#efe6f5;color:#9a8db0;font-family:var(--display)}
.sheet .fk.on,.sheet .tl.on{background:var(--ink);color:#fff}
.filebtn{font-family:var(--display);font-size:15px;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.pal .sw{width:30px;height:30px}
.goods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.good{background:#fff;border:1.5px solid #ece2f2;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gimg{background:#1e1040;border-radius:6px;display:flex;justify-content:center;padding:6px}.gimg img{width:84px;image-rendering:pixelated}
.gn{font-family:var(--display);font-size:15px}.gn .tag{font-size:11px;color:#9a8db0;margin-left:6px;font-family:var(--body)}
.gp{font-family:var(--display);color:var(--berry-deep);font-variant-numeric:tabular-nums}.gd{font-size:12px;color:#5c4f73;overflow-wrap:anywhere}
.good button{font-size:13px;padding:8px;margin-top:auto}.good button:disabled{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>
<body>

<div class="hud">
  <h1>행성 <span>#1203</span><small>쭈일리언 생일 탐사 · 주은 생일카페</small></h1>
  <div class="hud-r">
    <span class="chip" id="dday">착륙까지 —</span>
    <span class="chip">교신 해독 <b id="prog">0/5</b></span>
    <span class="chip">접속 <b id="online">1</b>명</span>
    <button class="ghost" id="meBtn">내 대원</button>
  </div>
</div>

<div class="stage">
  <canvas id="cv" aria-label="행성 #1203 지도. 위아래좌우로 돌아다니며 조사 기지에 들어갈 수 있어요"></canvas>
  <button class="enter" id="enterBtn" hidden>들어가기</button>
  <button class="skip" id="skipBtn" hidden>건너뛰기</button>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="start" id="start">
    <form class="start-card" id="startForm">
      <h2>미확인 교신 수신</h2>
      <p>…1203…1203… 쭈일리언과 하늘이가 신호를 따라 행성 #1203에 착륙합니다. 탐사대원 이름을 정해 주세요.</p>
      <input id="nameIn" maxlength="10" placeholder="대원 이름" aria-label="대원 이름" autocomplete="off">
      <div class="sws" id="startSw"></div>
      <button class="go" type="submit">착륙하기</button>
    </form>
  </div>
</div>

<form class="chat" id="chatForm"><input id="chatIn" maxlength="40" placeholder="대원들에게 말하기" autocomplete="off" aria-label="채팅 메시지"><button type="submit">보내기</button><button type="button" class="emo" data-e="🎂" aria-label="케이크">🎂</button><button type="button" class="emo" data-e="💜" aria-label="하트">💜</button><button type="button" class="emo" data-e="👋" aria-label="손 흔들기">👋</button></form>
<div class="pad">
  <div class="dpad">
    <button class="u" data-d="up" aria-label="위로">▲</button>
    <button class="l" data-d="left" aria-label="왼쪽">◀</button>
    <button class="r" data-d="right" aria-label="오른쪽">▶</button>
    <button class="d" data-d="down" aria-label="아래로">▼</button>
  </div>
  <div class="hint"><b>이동</b> 십자패드, 또는 화면을 톡 눌러 그 자리로<br><b>입장</b> 기지 문 앞이나 UFO 앞 쭈일리언 앞에 서면 버튼이 떠요<br>키보드: 방향키·WASD 이동, E 입장</div>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-h"><h2 id="sheetTitle"></h2><button class="x" id="closeBtn" aria-label="닫기">✕</button></div>
    <div id="sheetBody" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const OL='#2a1f3d';

/* ---------- 미션 / 교신 ---------- */
const MISSIONS=[
  {id:'photo',label:'착륙 증거 사진 남기기'},{id:'game',label:'숨은 외계인 15명 찾기'},
  {id:'draw',label:'쭈일리언 몽타주 그리기'},{id:'guest',label:'교신 기록 남기기'},{id:'gallery',label:'사진관에 사진 걸기'}];
const SECRET='HAPPY BIRTHDAY JUUN';
let done=store.get('jc_done',{}),endingSeen=store.get('jc_end',false),pendingEnding=false;
const doneCount=()=>MISSIONS.filter(m=>done[m.id]).length;
function decoded(){const letters=[...SECRET].map((ch,i)=>({ch,i})).filter(o=>o.ch!==' ');const show=Math.round(letters.length*doneCount()/5);
  const order=letters.map(o=>o.i).sort((a,b)=>((a*7)%19)-((b*7)%19)).slice(0,show);
  return [...SECRET].map((ch,i)=>ch===' '?' ':order.includes(i)?ch:'<i>▒</i>').join('')}

/* 3. 몽타주 연구소 · 촘촘한 도트 */
function openDraw(){
  const pal=['#2a1f3d','#5c4f73','#ff6f91','#ffb3d1','#ffb86b','#ffd166','#7fdc8a','#7fe0c2','#7fa8ff','#b98cff','#d9c6f5','#ffe0cc','#4a3045','#ffffff'];
  openSheet('몽타주 연구소',`${mTag('draw')}<p>주민들이 목격한 쭈일리언을 48×48 도트로 그려 주세요. 흰색은 지우개예요. 완성하면 전시관에 걸려요.</p>
  <button class="soft" id="dHall">몽타주 전시관 구경하기 →</button>
  ${refBox(false)}
  <div class="dwrap" id="dw"><canvas id="dc" style="image-rendering:pixelated"></canvas></div>
  <div class="row" style="justify-content:center"><button class="soft" id="zOut" aria-label="축소">－</button><span class="zl" id="zl">100%</span><button class="soft" id="zIn" aria-label="확대">＋</button><button class="soft" id="zReset">원래 크기</button></div>
  <p class="zhint">두 손가락으로 벌리면 확대, 오므리면 축소, 두 손가락으로 끌면 이동해요.</p>
  <div class="row pal">${pal.map((p,i)=>`<button class="sw${i?'':' on'}" data-c="${p}" style="background:${p};${p==='#ffffff'?'box-shadow:inset 0 0 0 1px #ccc':''}" aria-label="색 ${i+1}"></button>`).join('')}</div>
  <div class="row"><span style="font-size:13px;color:#5c4f73">붓</span><button class="soft tl on" data-b="1">1칸</button><button class="soft tl" data-b="2">2칸</button><button class="soft tl" data-b="3">3칸</button><button class="soft tl" data-b="fill">채우기</button></div>
  <label class="f" for="dtitle">작품 이름<input id="dtitle" maxlength="16" placeholder="예: 반짝이는 쭈일리언"></label>
  <div class="row"><button class="soft" id="dundo">되돌리기</button><button class="soft" id="dclr">다 지우기</button><button class="primary" id="ddone">완성</button></div>
  <img class="out" id="dimg" alt="쭈일리언 목격 몽타주" hidden><div id="dsave" hidden>${saveUI('dimg','1203-몽타주.png')}</div>
  <div class="row" id="dhallrow" hidden style="justify-content:center"><span class="save">전시관에 걸렸어요!</span><button class="soft" id="dgo">전시관에서 보기</button></div>`);
  $('#dHall').onclick=openMontageHall;
  const N=48,CS=10,cvs=$('#dc');cvs.width=N*CS;cvs.height=N*CS;const c=cvs.getContext('2d');
  let grid=Array(N*N).fill('#ffffff'),col=pal[0],tool=1,down=false,lx=-1,ly=-1,drew=false;const hist=[];
  const paint=()=>{grid.forEach((g,i)=>{c.fillStyle=g;c.fillRect((i%N)*CS,Math.floor(i/N)*CS,CS,CS)});
    for(let i=0;i<=N;i++){c.fillStyle=i%8===0?'rgba(42,31,61,.16)':'rgba(42,31,61,.06)';c.fillRect(i*CS,0,1,N*CS);c.fillRect(0,i*CS,N*CS,1)}};
  const stamp=(x,y)=>{const n=tool,o=Math.floor((n-1)/2);for(let j=0;j<n;j++)for(let i=0;i<n;i++){const a=x-o+i,b=y-o+j;if(a>=0&&b>=0&&a<N&&b<N)grid[b*N+a]=col}};
  const line=(x0,y0,x1,y1)=>{const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){stamp(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}};
  const fill=(x,y)=>{const from=grid[y*N+x];if(from===col)return;const q=[[x,y]];while(q.length){const[a,b]=q.pop();if(a<0||b<0||a>=N||b>=N||grid[b*N+a]!==from)continue;grid[b*N+a]=col;q.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}};
  const cell=e=>{const r=cvs.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/r.width*N),Math.floor((e.clientY-r.top)/r.height*N)]};
  const dw=$('#dw');let z=1,tx=0,ty=0,pinch=null,pinched=false,strokeSnap=null;const pts=new Map();
  const applyZ=()=>{const W=dw.clientWidth;z=Math.max(1,Math.min(8,z));tx=Math.min(0,Math.max(W-W*z,tx));ty=Math.min(0,Math.max(W-W*z,ty));cvs.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;$('#zl').textContent=Math.round(z*100)+'%'};
  const zoomAt=(nz,cx,cy)=>{const px=(cx-tx)/z,py=(cy-ty)/z;z=Math.max(1,Math.min(8,nz));tx=cx-px*z;ty=cy-py*z;applyZ()};
  const local=e=>{const r=dw.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const pinchInfo=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,mx:(a[0]+b[0])/2,my:(a[1]+b[1])/2}};
  dw.addEventListener('pointerdown',e=>{dw.setPointerCapture(e.pointerId);pts.set(e.pointerId,local(e));
    if(pts.size===2){if(down&&strokeSnap){grid=strokeSnap;hist.pop();paint()}down=false;strokeSnap=null;pinched=true;const p=pinchInfo();pinch={...p,z0:z,px:(p.mx-tx)/z,py:(p.my-ty)/z};return}
    if(pts.size>2||pinched)return;
    const[x,y]=cell(e);if(x<0||y<0||x>=N||y>=N)return;strokeSnap=grid.slice();hist.push(strokeSnap);if(hist.length>30)hist.shift();drew=true;
    if(tool==='fill'){fill(x,y);paint();strokeSnap=null;return}down=true;lx=x;ly=y;stamp(x,y);paint()});
  dw.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,local(e));
    if(pts.size>=2&&pinch){const p=pinchInfo();z=Math.max(1,Math.min(8,pinch.z0*p.d/pinch.d));tx=p.mx-pinch.px*z;ty=p.my-pinch.py*z;applyZ();return}
    if(!down)return;const[x,y]=cell(e);if(x===lx&&y===ly)return;const cx=Math.max(0,Math.min(N-1,x)),cy=Math.max(0,Math.min(N-1,y));line(lx,ly,cx,cy);lx=cx;ly=cy;paint()});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0){down=false;pinched=false;strokeSnap=null}};
  ['pointerup','pointercancel'].forEach(ev=>dw.addEventListener(ev,up));
  dw.addEventListener('wheel',e=>{e.preventDefault();const[cx,cy]=local(e);zoomAt(z*(e.deltaY<0?1.15:1/1.15),cx,cy)},{passive:false});
  $('#zIn').onclick=()=>zoomAt(z*1.5,dw.clientWidth/2,dw.clientWidth/2);$('#zOut').onclick=()=>zoomAt(z/1.5,dw.clientWidth/2,dw.clientWidth/2);$('#zReset').onclick=()=>{z=1;tx=0;ty=0;applyZ()};
  document.querySelectorAll('.pal .sw').forEach(b=>b.onclick=()=>{col=b.dataset.c;document.querySelectorAll('.pal .sw').forEach(x=>x.classList.toggle('on',x===b))});
  document.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{tool=b.dataset.b==='fill'?'fill':+b.dataset.b;document.querySelectorAll('.tl').forEach(x=>x.classList.toggle('on',x===b))});
  $('#dundo').onclick=()=>{if(hist.length){grid=hist.pop();paint()}};
  $('#dclr').onclick=()=>{hist.push(grid.slice());grid.fill('#ffffff');paint()};paint();
  $('#ddone').onclick=()=>{if(!drew)return;const W=480,H=600,o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
    x.fillStyle='#170d33';x.fillRect(0,0,W,H);x.fillStyle='#ffd166';for(let i=0;i<30;i++)x.fillRect((i*97)%W,(i*53)%H,4,4);
    x.fillStyle=OL;x.fillRect(20,20,440,440);grid.forEach((g,i)=>{x.fillStyle=g;x.fillRect(24+(i%N)*9,24+Math.floor(i/N)*9,9,9)});
    x.fillStyle='#8ff0d2';x.textAlign='center';x.font='30px Jua, sans-serif';x.fillText('쭈일리언 목격 몽타주',W/2,H-82);
    x.font='17px Jua, sans-serif';x.fillStyle='#fff';x.fillText('행성 #1203 · 제보 대원 '+me.name,W/2,H-44);
    $('#dimg').src=o.toDataURL('image/png');$('#dimg').hidden=false;$('#dsave').hidden=false;markDone('draw');
    const sm=document.createElement('canvas');sm.width=N;sm.height=N;const sx=sm.getContext('2d');grid.forEach((g,i)=>{sx.fillStyle=g;sx.fillRect(i%N,Math.floor(i/N),1,1)});
    const arr=monMine();arr.push({id:'m'+Date.now(),img:sm.toDataURL('image/png'),t:$('#dtitle').value.trim()||'나의 쭈일리언',n:me.name});store.set('jc_montages',arr);
    $('#dhallrow').hidden=false;$('#dgo').onclick=openMontageHall;$('#dimg').scrollIntoView({behavior:'smooth',block:'nearest'})};
}

/* 4. 교신 해독실 */
const sampleNotes=[{n:'예시대원_별딸기',m:'주은아 생일 진심으로 축하해! 행성 #1203에서 영원히 행복하길 🍓',ex:1},{n:'예시대원_1203',m:'신호 잡혔다! 12월 3일은 우리 행성 최대 명절이에요.',ex:1}];
function openGuest(){
  const esc=s=>s.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const render=()=>{const mine=store.get('jc_notes',[]);$('#gl').innerHTML=[...mine].reverse().concat(sampleNotes).map(x=>`<div class="note"><span class="who">${esc(x.n)}</span>${x.ex?'<span class="tag">예시</span>':''}<div class="msg">${esc(x.m)}</div></div>`).join('')};
  openSheet('교신 해독실',`${mTag('guest')}<p>행성에서 잡힌 교신 기록이에요. 주은이에게 보낼 생일 메시지를 남기면 신호가 더 강해져요.</p>
  <form id="gf" class="gb"><label class="f" for="gn">대원 이름<input id="gn" maxlength="16"></label>
  <label class="f" for="gm">교신 메시지<textarea id="gm" maxlength="200" placeholder="생일 축하해 주은아!"></textarea></label>
  <button class="primary" type="submit">교신 보내기</button></form><div class="gb" id="gl"></div>`);
  $('#gn').value=me.name;render();
  $('#gf').addEventListener('submit',e=>{e.preventDefault();const n=$('#gn').value.trim()||me.name,m=$('#gm').value.trim();if(!m){$('#gm').focus();return}
    const a=store.get('jc_notes',[]);a.push({n,m});store.set('jc_notes',a);$('#gm').value='';render();markDone('guest')});
}

/* 5. 쭈니 사진관 (휴대폰 세로 9:16 비율) */
function placeholderArt(i){const c=document.createElement('canvas');c.width=90;c.height=160;const x=c.getContext('2d');
  const bg=[['#2b1d55','#ff8fab'],['#1e1040','#8ff0d2'],['#3b2d6b','#ffd166']][i%3];x.fillStyle=bg[0];x.fillRect(0,0,90,160);
  x.fillStyle=bg[1];for(let k=0;k<20;k++)x.fillRect((k*37+i*11)%88,(k*23+i*7)%158,2,2);
  x.globalAlpha=.22;x.fillStyle='#fff';x.fillRect(27,52,36,58);x.fillRect(35,34,20,20);x.globalAlpha=1;
  x.imageSmoothingEnabled=false;const sp=i===1?alienSprite('#ffb3cf'):i===2?alienSprite('#7fdc8a'):ZZU;x.drawImage(sp,Math.round(45-sp.width),128,sp.width*2,sp.height*2);
  return c.toDataURL()}
const SAMPLE_EX=[
  {id:'ex1',t:'반달 눈웃음',w:'무대에서 웃을 때 눈이 반달이 되는 순간이 제일 좋아요. 보는 사람까지 같이 웃게 돼요.',n:'예시대원_별딸기',ex:1},
  {id:'ex2',t:'연습실의 주은',w:'안 보이는 데서도 끝까지 동작 하나하나 챙기는 모습이 멋있어요.',n:'예시대원_1203',ex:1},
  {id:'ex3',t:'손하트 장인',w:'팬들 쪽으로 몸을 돌려서 손하트 해 줄 때마다 행성 #1203에 불이 하나씩 켜지는 기분이에요.',n:'예시대원_쭈쭈',ex:1}];
let exImgs=null,galMem=null;
function openGallery(){
  if(!exImgs)exImgs=SAMPLE_EX.map((_,i)=>placeholderArt(i));
  const mine=()=>galMem||(galMem=store.get('jc_gallery',[]));
  const likes=store.get('jc_likes',{});
  const all=()=>[...mine().slice().reverse(),...SAMPLE_EX.map((e,i)=>({...e,img:exImgs[i]}))];
  function list(){const items=all();
    openSheet('쭈니 사진관',`${mTag('gallery')}<p>대원들이 고른 주은이의 순간들이에요. 사진을 누르면 그 사진을 고른 이유도 볼 수 있고, 옆으로 넘기며 구경할 수 있어요.</p>
    <button class="primary" id="gaAdd">사진 걸기</button>
    <div class="gal">${items.map((e,k)=>`<button class="ex" data-k="${k}"><span class="exf"><img src="${e.img}" alt="${escH(e.t)}"></span><span class="pl"><b>${escH(e.t)}</b>${e.ex?'<i>예시</i>':''}<small>${escH(e.n)}${likes[e.id]?' 💜':''}</small></span></button>`).join('')}</div>`);
    $('#gaAdd').onclick=form;
    document.querySelectorAll('.ex').forEach(b=>b.onclick=()=>openViewer({items,index:+b.dataset.k,ratio:'9/16',
      title:e=>e.t,img:e=>e.img,alt:e=>e.t,back:list,
      body:e=>`<div class="whyh">이 사진을 고른 이유</div><blockquote class="why">${escH(e.w)}</blockquote><p class="by">고른 대원 · ${escH(e.n)}${e.ex?' · 예시 작품':''}</p>`,
      extra:e=>`<button class="${likes[e.id]?'primary':'soft'}" id="gaLike">${likes[e.id]?'💜 좋아요 했어요':'💜 좋아요'}</button>${e.ex?'':'<button class="soft" id="gaDel">사진 내리기</button>'}`,
      mount:(e,show)=>{$('#gaLike').onclick=()=>{likes[e.id]=!likes[e.id];store.set('jc_likes',likes);show()};
        if(!e.ex)$('#gaDel').onclick=()=>{const d=$('#gaDel');if(!d.dataset.sure){d.dataset.sure=1;d.textContent='한 번 더 누르면 내려가요';return}galMem=mine().filter(x=>x.id!==e.id);store.set('jc_gallery',galMem);list()}}}));
  }
  function form(){
    openSheet('사진 걸기',`<p>주은이 사진 한 장과, 그 사진을 고른 이유를 적어 주세요. 휴대폰 세로 비율(9:16)로 걸려요.</p>
    <label class="f" for="gaFile">사진<input type="file" id="gaFile" accept="image/*"></label>
    <div class="vw" id="gaPrev" style="aspect-ratio:9/16" hidden><img id="gaPrevImg" alt="올릴 사진 미리보기"></div>
    <label class="f" for="gaT">사진 이름<input id="gaT" maxlength="20" placeholder="예: 반달 눈웃음"></label>
    <label class="f" for="gaW">이 사진을 고른 이유<textarea id="gaW" maxlength="150" placeholder="이 순간이 왜 좋은지 적어 주세요"></textarea></label>
    <label class="f" for="gaN">고른 대원<input id="gaN" maxlength="16"></label>
    <div class="row"><button class="soft" id="gaBack">← 사진관으로</button><button class="primary" id="gaGo">사진 걸기</button></div><p id="gaMsg" class="save"></p>`);
    $('#gaN').value=me.name;let img=null;$('#gaBack').onclick=list;
    $('#gaFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,1080/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      img=c.toDataURL('image/jpeg',.8);$('#gaPrevImg').src=img;$('#gaPrev').hidden=false};im.src=r.result};r.readAsDataURL(f)});
    $('#gaGo').onclick=()=>{const t=$('#gaT').value.trim(),w=$('#gaW').value.trim(),n=$('#gaN').value.trim()||me.name;
      if(!img){$('#gaMsg').textContent='사진을 먼저 골라 주세요';return}if(!t||!w){$('#gaMsg').textContent='사진 이름과 고른 이유를 적어 주세요';return}
      const arr=mine();arr.push({id:'my'+Date.now(),img,t,w,n});
      try{localStorage.setItem('jc_gallery',JSON.stringify(arr))}catch(e){}
      markDone('gallery');list()};
  }
  list();
}

/* 쭈일리언 참고 그림: 공식 그림이 준비되면 REF_IMG에 이미지 주소를 넣으면 돼요 */
const REF_IMG=null;
function refBox(open){const src=REF_IMG||(()=>{const c=document.createElement('canvas');c.width=17*12;c.height=19*12;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(ZZU,0,0,c.width,c.height);return c.toDataURL()})();
  return `<details class="ref"${open?' open':''}><summary>쭈일리언 참고 그림 보기</summary><div class="refin"><img src="${src}" alt="쭈일리언 참고 그림"${REF_IMG?'':' class="px"'}><p>${REF_IMG?'이 그림을 보면서 그려 보세요.':'공식 쭈일리언 그림은 추후 들어가요. 지금은 임시 도트 그림이에요.'}</p></div></details>`}
/* 몽타주 전시관 */
let monMem=null,monEx=null;
const monMine=()=>monMem||(monMem=store.get('jc_montages',[]));
function monExamples(){if(monEx)return monEx;
  const mkImg=(spr,k,bg)=>{const c=document.createElement('canvas');c.width=48;c.height=48;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,48,48);x.imageSmoothingEnabled=false;const w=spr.width*k,h=spr.height*k;x.drawImage(spr,Math.round((48-w)/2),Math.round((48-h)/2),w,h);return c.toDataURL()};
  return monEx=[{id:'mx1',n:'예시대원_별딸기',t:'우주복 쭈일리언',img:mkImg(playerSprite('#ff6f91','down',0),2,'#ffffff'),ex:1},
    {id:'mx2',n:'예시대원_1203',t:'하늘이랑 쭈일리언',img:mkImg(ZZU,2,'#fff7f0'),ex:1},
    {id:'mx3',n:'예시주민',t:'초록 친구 버전',img:mkImg(alienSprite('#7fdc8a'),3,'#efe8fd'),ex:1}]}
function openMontageHall(){
  const items=[...monMine().slice().reverse(),...monExamples()];
  openSheet('몽타주 전시관',`${mTag('draw')}<p>대원들이 그린 쭈일리언 몽타주를 구경하는 곳이에요. 작품을 누르면 크게 보고 옆으로 넘겨 볼 수 있어요.</p>
  ${refBox(true)}
  <button class="primary" id="mnNew">보고 그리러 가기</button>
  <div class="mgal">${items.map((m,k)=>`<button class="mex" data-k="${k}"><span class="mf"><img src="${m.img}" alt="${escH(m.t)}"></span><span class="pl"><b>${escH(m.t)}</b>${m.ex?'<i>예시</i>':''}<small>${escH(m.n)}</small></span></button>`).join('')}</div>`);
  $('#mnNew').onclick=openDraw;
  document.querySelectorAll('.mex').forEach(b=>b.onclick=()=>openViewer({items,index:+b.dataset.k,ratio:'1',pixel:true,
    title:m=>m.t,img:m=>m.img,alt:m=>m.t,back:openMontageHall,
    body:m=>`<p class="by">그린 대원 · ${escH(m.n)}${m.ex?' · 예시 작품':''}</p>`,
    extra:m=>m.ex?'':'<button class="soft" id="mnDel">작품 내리기</button>',
    mount:m=>{if(m.ex)return;$('#mnDel').onclick=()=>{const d=$('#mnDel');if(!d.dataset.sure){d.dataset.sure=1;d.textContent='한 번 더 누르면 내려가요';return}
      monMem=monMine().filter(x=>x.id!==m.id);store.set('jc_montages',monMem);openMontageHall()}}}));
}

/* 6. 굿즈 상점 */

  {n:'포토카드 세트',p:'₩5,000',d:'5장 1세트',a:["OOOOOOOO..","OLLLLLLO..","OLDDDDLOOO","OLDSSDLOWO","OLDDDDLOWO","OLLLLLLOWO","OOOOOOOOWO","...OWWWWWO","...OOOOOOO"]},

  {n:'도트 스티커팩',p:'₩3,000',d:'쭈일리언 · 하늘이 · 주민',a:["....OO....","...OYYO...","OOOOYYOOOO","OYYYYYYYYO",".OYYYYYYO.","..OYYYYO..",".OYYOOYYO.",".OOO..OOO."]},

let goodsImgs=null;
function goodsIcon(rows){const sp=sprite(rows,GPAL),k=7,c=document.createElement('canvas');c.width=14*k;c.height=12*k;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  x.drawImage(sp,Math.round((c.width-sp.width*k)/2),Math.round((c.height-sp.height*k)/2),sp.width*k,sp.height*k);return c.toDataURL()}
function openShop(){
  if(!goodsImgs)goodsImgs=GOODS.map(g=>goodsIcon(g.a));
  openSheet('굿즈 상점',`<p>주은 생일 굿즈를 구경하는 곳이에요. 지금 보이는 건 예시 상품이라, 실제 상품 사진과 가격, 판매 링크로 바꿔 넣으면 돼요.</p>
  <div class="goods">${GOODS.map((g,i)=>`<div class="good"><div class="gimg"><img src="${goodsImgs[i]}" alt="${g.n}"></div><div class="gn">${g.n}<span class="tag">예시</span></div><div class="gp">${g.p}</div><div class="gd">${g.d}</div><button class="soft" disabled>판매 링크 준비 중</button></div>`).join('')}</div>`);
}

/* 내 대원 */
$('#meBtn').addEventListener('click',()=>{
  openSheet('내 대원',`<label class="f" for="mn">대원 이름<input id="mn" maxlength="10"></label>
  <p>우주복 포인트 색</p>
  <div class="row">${COLORS.map(c=>`<button class="sw${c===me.color?' on':''}" data-c="${c}" style="background:${c}" aria-label="우주복 색"></button>`).join('')}</div>
  <button class="primary" id="msave">저장</button>`);
  $('#mn').value=me.name;let col=me.color;
  document.querySelectorAll('.sheet .sw').forEach(b=>b.onclick=()=>{col=b.dataset.c;document.querySelectorAll('.sheet .sw').forEach(x=>x.classList.toggle('on',x===b))});
  $('#msave').onclick=()=>{me.name=$('#mn').value.trim()||'대원';me.color=col;store.set('jc_me',{name:me.name,color:me.color});$('#nameIn').value=me.name;closeSheet()};
});

/* 디데이 */
const OPEN=Date.UTC(2026,11,3,3,3),CLOSE=Date.UTC(2026,11,17,15,0);
function tick(){const n=Date.now(),el=$('#dday');
  if(n<OPEN){const d=OPEN-n,dd=Math.floor(d/864e5),h=Math.floor(d/36e5)%24,m=Math.floor(d/6e4)%60,ss=Math.floor(d/1e3)%60;
    el.innerHTML=`착륙까지 <b>D-${dd}</b> ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
  else el.innerHTML=n<CLOSE?'<b>행성 개방 중</b>':'탐사 종료 · 고마워요'}
setInterval(()=>{tick();renderLog()},1000);tick();updateProg();

resize();camX=PAD.x-vw/2;camY=PAD.y-100-VH/2;
requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
