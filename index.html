<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주은 생일카페</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&family=Anton&family=Gothic+A1:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
/* 한 화면 게임: 위 HUD → 가운데 탑뷰 도트 행성(#1203) → 아래 십자패드. 보라 우주 + 라벤더 행성, 의도적으로 단일 테마 */
:root{
  --space:#170d33; --space-2:#1e1040; --panel:#2b1d55;
  --cream:#fff7f0; --berry:#ff6f91; --berry-deep:#d94a72; --mint:#8ff0d2; --gold:#ffd166;
  --ink:#2a1f3d; --muted:#b3a5dc; --line:#46337a;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--cream);font-family:var(--body);font-size:15px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  display:flex;flex-direction:column;gap:10px;max-width:1000px;margin:0 auto;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hud h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,28px);margin:0;letter-spacing:.5px;line-height:1.1}
.hud h1 span{color:var(--gold)}
.hud h1 small{display:block;font-size:12px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.hud-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.chip b{color:var(--mint);font-weight:400}
button{font-family:var(--display);font-size:15px;border:0;cursor:pointer;color:var(--ink);background:var(--cream);border-radius:8px;padding:10px 14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.ghost{background:var(--panel);color:var(--cream);border:1px solid var(--line)}
.stage{position:relative;flex:1 1 auto;min-height:300px;max-height:520px;border-radius:10px;overflow:hidden;border:3px solid var(--line);background:var(--space-2)}
#cv{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
.enter{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c99a2e;white-space:nowrap}
.skip{position:absolute;right:10px;top:10px;font-size:13px;padding:6px 10px;background:rgba(23,13,51,.7);color:var(--cream);border:1px solid var(--line)}
/* 시작 패널 */
.start{position:absolute;inset:auto 0 0 0;padding:14px;display:flex;justify-content:center}
.start-card{background:rgba(23,13,51,.92);border:3px solid var(--line);border-radius:10px;padding:16px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.start-card h2{font-family:var(--display);font-weight:400;margin:0;font-size:24px;color:var(--gold)}
.start-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.start-card input{font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--space);color:var(--cream);width:100%}
.start-card .go{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c99a2e;font-size:17px}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:6px;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--cream)}
.chat{display:flex;gap:6px;min-width:0}
.chat input{flex:1 1 auto;min-width:0;font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--cream)}
.chat input::placeholder{color:var(--muted)}
.chat.off input{opacity:.7}.chat.off button{opacity:.45;cursor:default}
.chat button{flex:none;background:var(--gold);color:var(--ink);padding:10px 12px}.chat .emo{background:var(--panel);border:2px solid var(--line);padding:8px 9px;font-size:16px}
.log{position:absolute;left:8px;top:8px;max-width:62%;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.lm{background:rgba(23,13,51,.78);color:#fff;font-size:12px;line-height:1.4;padding:3px 8px;border-radius:4px;overflow-wrap:anywhere}
.lm b{color:var(--gold);font-weight:400;font-family:var(--display)}.lm.me b{color:var(--mint)}
.gal,.mgal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ex{display:flex;flex-direction:column;gap:6px;background:none;padding:0;text-align:left;color:var(--ink);min-width:0}
.exf{display:block;background:#2a1f3d;padding:6px;border-radius:4px;box-shadow:inset 0 0 0 3px #ffd166,0 4px 0 #c99a2e}
.exf img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:2px}
.exf.big img{aspect-ratio:auto;max-height:60vh;object-fit:contain;background:#170d33}
.pl{display:flex;flex-direction:column;gap:2px;background:#fff;border:1.5px solid #ece2f2;border-radius:4px;padding:6px 8px;min-width:0}
.pl b{font-family:var(--display);font-weight:400;font-size:14px;overflow-wrap:anywhere}.pl i{font-style:normal;font-size:11px;color:#9a8db0}.pl small{font-size:12px;color:#5c4f73;overflow-wrap:anywhere}
.why{margin:0;font-size:16px;line-height:1.6;color:var(--ink);border-left:4px solid #ffd166;padding:4px 0 4px 12px;overflow-wrap:anywhere}
.sheet p.by{font-size:13px;color:#9a8db0}
.gwrap{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:3/4}
.gwrap canvas{width:100%;height:100%}
.gres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:8px;padding:12px}
.gres b{font-family:var(--display);font-weight:400;font-size:clamp(44px,14vw,64px);line-height:1;letter-spacing:2px}
.gres span{font-family:var(--display);font-size:15px;color:#fff}
.gres.win{background:rgba(23,13,51,.6)}.gres.win b{color:var(--gold);text-shadow:0 4px 0 #c99a2e,0 0 18px rgba(255,209,102,.6);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.gres.lose{background:rgba(23,13,51,.7)}.gres.lose b{color:#ffb3cf;font-size:clamp(34px,10vw,46px)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.gtoast{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--display);background:var(--gold);color:var(--ink);padding:6px 12px;border-radius:6px;white-space:nowrap}
.gtoast.go{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.dwrap{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto;overflow:hidden;border:2px solid #ece2f2;border-radius:8px;touch-action:none;background:#fff}
.dwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;border-radius:0}
.zl{font-family:var(--display);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.sheet p.zhint{font-size:12px;color:#9a8db0;text-align:center}
.mex{display:flex;flex-direction:column;gap:6px;background:none;padding:0;text-align:left;color:var(--ink);min-width:0}
.mf{display:block;background:#2a1f3d;padding:4px;border-radius:4px;box-shadow:inset 0 0 0 2px #8ff0d2}.mf img{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;background:#fff}
.pl b{font-size:13px}.pl small{font-size:11px}
.vw{position:relative;width:100%;max-width:340px;margin:0 auto;background:#170d33;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 3px #ffd166;touch-action:pan-y}
.vw img{position:absolute;left:6px;top:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:contain;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.vw.px{box-shadow:inset 0 0 0 3px #8ff0d2}.vw.px img{image-rendering:pixelated}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:56px;padding:0;background:rgba(23,13,51,.6);color:#fff;font-size:16px;border-radius:6px}
.vnav.l{left:8px}.vnav.r{right:8px}
.vcount{text-align:center;font-size:12px;color:#9a8db0;font-variant-numeric:tabular-nums}
.whyh{font-family:var(--display);font-size:13px;color:var(--berry-deep)}
.booth9{position:relative;width:min(100%,calc(50vh * 9 / 16));aspect-ratio:9/16;margin:0 auto;background:#170d33;border-radius:6px;overflow:hidden}
.booth9 video{position:absolute;left:5.556%;top:3.125%;width:88.889%;height:79.167%;object-fit:cover}.booth9 video.mir{transform:scaleX(-1)}
.sheet .booth9 canvas{background:transparent}
.sheet .booth9 #pchar{background:#1e1040}
.booth9 #pchar{inset:auto;left:5.556%;top:3.125%;width:88.889%;height:79.167%;image-rendering:pixelated}
.bctl{position:absolute;left:0;right:0;bottom:4%;display:flex;align-items:center;justify-content:center;gap:26px;z-index:3}
.bshut{width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid #ffd166;box-shadow:0 0 0 3px #2a1f3d,0 4px 12px rgba(0,0,0,.35);padding:0}
.bflip,.bsp{width:46px;height:46px;flex:none}.bflip{border-radius:50%;background:rgba(23,13,51,.8);color:#fff;padding:0;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.5)}
.bstart{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:3;white-space:nowrap}
.booth9 .cd{font-size:110px;pointer-events:none;z-index:2;text-shadow:0 4px 0 var(--ink),0 0 24px rgba(0,0,0,.4)}
.booth9 #pshot{position:absolute;inset:0;width:100%;height:100%}
.booth9 canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:0;background:transparent}
.stkwrap{width:min(100%,calc(52vh * 9 / 16));aspect-ratio:9/16;margin:0 auto;touch-action:none}
.stkwrap canvas{width:100%;height:100%;border-radius:6px}
.stk{padding:6px 8px}.stk img{width:32px;display:block;image-rendering:pixelated}
.ref{background:#fff;border:1.5px solid #ece2f2;border-radius:8px;padding:8px 12px}
.ref summary{font-family:var(--display);cursor:pointer;color:var(--ink)}
.refin{display:flex;gap:12px;align-items:center;margin-top:8px}
.refin img{width:96px;flex:none;border-radius:6px;background:#efe8fd}.refin img.px{image-rendering:pixelated;padding:6px}
.refin p{font-size:13px;margin:0}
/* 패드 */
.pad{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px}
.dpad button{background:var(--panel);color:var(--cream);border:2px solid var(--line);font-size:18px;padding:0;touch-action:none;border-radius:8px}
.dpad button.on,.dpad button:active{background:var(--line)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.hint{font-size:12px;color:var(--muted);line-height:1.5;min-width:0}
.hint b{color:var(--cream);font-weight:400;font-family:var(--display)}
/* 모달 */
.veil{position:fixed;inset:0;background:rgba(10,6,24,.75);display:flex;align-items:flex-end;justify-content:center;z-index:10;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--cream);color:var(--ink);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:14px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.x{background:#ece4f3;color:var(--ink);width:40px;height:40px;padding:0;border-radius:8px;font-size:18px;flex:none}
.sheet p{margin:0;line-height:1.55;color:#5c4f73}
.mission{font-family:var(--display);font-size:13px;color:var(--berry-deep);letter-spacing:.5px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet .primary{background:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.sheet .soft{background:#efe6f5;color:var(--ink)}
.sheet .sw.on{border-color:var(--ink)}
.sheet img.out{width:100%;border-radius:8px;display:block;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default;image-rendering:pixelated}
.save{font-size:13px;color:var(--berry-deep);text-align:center}
.sheet canvas{display:block;width:100%;border-radius:8px;touch-action:none;background:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#5c4f73;flex:1 1 140px;min-width:0}
.sheet input,.sheet select,.sheet textarea{font-family:var(--body);font-size:16px;padding:10px 12px;border-radius:8px;border:1.5px solid #e0d6ea;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:70px}
.gb{display:flex;flex-direction:column;gap:8px}
.note{background:#fff;border-radius:8px;padding:10px 12px;border:1.5px solid #ece2f2}
.note .who{font-family:var(--display);font-size:15px;color:var(--berry-deep)}
.note .tag{font-size:11px;color:#9a8db0;margin-left:6px}
.note .msg{margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
.stat{font-family:var(--display);font-variant-numeric:tabular-nums;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stat b{color:var(--berry-deep);font-weight:400}
.decode{font-family:var(--display);font-size:clamp(22px,7vw,30px);letter-spacing:4px;text-align:center;background:var(--space);color:var(--mint);border-radius:8px;padding:16px 10px;overflow-wrap:anywhere}
.decode i{font-style:normal;color:#4c3c88}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1.5px solid #ece2f2;border-radius:8px;padding:9px 12px}
.checks li span:last-child{font-family:var(--display);color:#9a8db0}
.checks li.ok span:last-child{color:#2a9d78}
.booth{position:relative;aspect-ratio:4/3;background:#170d33;border-radius:8px;overflow:hidden;border:3px solid var(--ink)}
.booth video,.booth canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:transparent;border-radius:0}
.booth video{transform:scaleX(-1)}.booth canvas{image-rendering:pixelated;pointer-events:none}
.cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:72px;color:#fff;text-shadow:0 4px 0 var(--ink)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:fl .45s ease-out}@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.thumbs img,.thumbs span{width:100%;aspect-ratio:4/3;border-radius:6px;object-fit:cover;display:flex;align-items:center;justify-content:center;background:#efe6f5;color:#9a8db0;font-family:var(--display)}
.sheet .fk.on,.sheet .tl.on,.sheet .pm.on{background:var(--ink);color:#fff}
.filebtn{font-family:var(--display);font-size:15px;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--berry);color:#fff;box-shadow:0 3px 0 var(--berry-deep)}
.pal .sw{width:30px;height:30px}
.goods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.good{background:#fff;border:1.5px solid #ece2f2;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gimg{background:#1e1040;border-radius:6px;display:flex;justify-content:center;padding:6px}.gimg img{width:84px;image-rendering:pixelated}
.gn{font-family:var(--display);font-size:15px}.gn .tag{font-size:11px;color:#9a8db0;margin-left:6px;font-family:var(--body)}
.gp{font-family:var(--display);color:var(--berry-deep);font-variant-numeric:tabular-nums}.gd{font-size:12px;color:#5c4f73;overflow-wrap:anywhere}
.good button{font-size:13px;padding:8px;margin-top:auto}.good button:disabled{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* ===== 운영진 공간 ===== */
.foot{display:flex;justify-content:center;padding:6px 0 2px}
.adminLink{background:none;color:var(--muted);font-family:var(--body);font-size:12px;padding:8px 12px;opacity:.7;text-decoration:underline;text-underline-offset:3px}
.rp-foot .adminLink{color:#8f84ad;padding:8px 0}
.adm{position:fixed;inset:0;z-index:12;overflow-y:auto;background:#fff7f0;color:var(--ink);font-family:var(--body);-webkit-user-select:text;user-select:text}
.adw{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.ad-top{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1.5px solid #ece2f2}
.ad-top b{font-family:var(--display);font-weight:400;font-size:20px}.ad-top span{margin-left:auto}
.ad-x{background:#ece4f3;color:var(--ink);width:40px;height:40px;padding:0;font-size:16px}
.ad-link{background:none;color:var(--berry-deep);font-size:14px;padding:8px}
.ad-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0}

.ad-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:#5c4f73}
.ad-chips{display:flex;gap:6px}.ad-chips button{font-size:13px;padding:6px 10px}
.ad-list{display:flex;flex-direction:column;gap:8px}

.ad-im{flex:none;width:64px;height:84px;border-radius:6px;overflow:hidden;background:#efe6f5;display:block}
.ad-im img{width:100%;height:100%;object-fit:cover;display:block}.ad-im.px{height:64px}.ad-im.px img{object-fit:contain;image-rendering:pixelated}

<body>

<div class="hud">
  <h1>행성 <span>#1203</span><small>쭈일리언 생일 탐사 · 주은 생일카페</small></h1>
  <div class="hud-r">
    <span class="chip" id="dday">착륙까지 —</span>
    <span class="chip">교신 해독 <b id="prog">0/5</b></span>
    <span class="chip">접속 <b id="online">1</b>명</span>
    <button class="ghost" id="rpBtn" hidden>탐사 그만하기</button>
    <button class="ghost" id="meBtn">내 대원</button>
  </div>
</div>

<div class="stage">
  <canvas id="cv" aria-label="행성 #1203 지도. 위아래좌우로 돌아다니며 조사 기지에 들어갈 수 있어요"></canvas>
  <button class="enter" id="enterBtn" hidden>들어가기</button>
  <button class="skip" id="skipBtn" hidden>건너뛰기</button>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="start" id="start">
    <form class="start-card" id="startForm">
      <h2>미확인 교신 수신</h2>
      <p>…1203…1203… 쭈일리언과 하늘이가 신호를 따라 행성 #1203에 착륙합니다. 탐사대원 이름을 정해 주세요.</p>
      <input id="nameIn" maxlength="10" placeholder="대원 이름" aria-label="대원 이름" autocomplete="off">
      <div class="sws" id="startSw"></div>
      <button class="go" type="submit">착륙하기</button>
      <button type="button" class="ghost" id="startRp" hidden>탐사 보고서 바로 보기</button>
    </form>
  </div>
</div>

<form class="chat" id="chatForm"><input id="chatIn" maxlength="40" placeholder="대원들에게 말하기" autocomplete="off" aria-label="채팅 메시지"><button type="submit">보내기</button><button type="button" class="emo" data-e="🎂" aria-label="케이크">🎂</button><button type="button" class="emo" data-e="💜" aria-label="하트">💜</button><button type="button" class="emo" data-e="👋" aria-label="손 흔들기">👋</button></form>
<div class="pad">
  <div class="dpad">
    <button class="u" data-d="up" aria-label="위로">▲</button>
    <button class="l" data-d="left" aria-label="왼쪽">◀</button>
    <button class="r" data-d="right" aria-label="오른쪽">▶</button>

function outlined(src){const c=document.createElement('canvas');c.width=src.width+2;c.height=src.height+2;const x=c.getContext('2d');
  const d=src.getContext('2d').getImageData(0,0,src.width,src.height).data,a=(i,j)=>i>=0&&j>=0&&i<src.width&&j<src.height&&d[(j*src.width+i)*4+3]>0;
  x.fillStyle='#3a2459';for(let j=-1;j<=src.height;j++)for(let i=-1;i<=src.width;i++)if(!a(i,j)&&(a(i-1,j)||a(i+1,j)||a(i,j-1)||a(i,j+1)))x.fillRect(i+1,j+1,1,1);
  x.drawImage(src,1,1);return c}

function charScene(seed,color){const W=120,H=190,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  let q=seed;const r=()=>(q=(q*16807)%2147483647)/2147483647;
  x.fillStyle='#1e1040';x.fillRect(0,0,W,H);
  for(let i=0;i<46;i++){const k=r();x.fillStyle=k<.15?'#ffd166':k<.55?'#ffffff':'#9b86d8';x.fillRect(Math.floor(r()*W),Math.floor(r()*104),1,1)}
  const pl=[['#ff8fab',8],['#8ff0d2',6],['#ffd166',7]][Math.floor(r()*3)],px=20+Math.floor(r()*80),py=16+Math.floor(r()*30);
  x.fillStyle=pl[0];for(let y=-pl[1];y<=pl[1];y++){const w=Math.round(Math.sqrt(pl[1]*pl[1]-y*y));x.fillRect(px-w,py+y,w*2,1)}
  x.drawImage(ground,PAD.x-60,PAD.y-38,120,86,0,104,120,86);
  x.drawImage(UFO,46+Math.floor(r()*10),84,66,42);
  const al=[alienSprite('#7fdc8a'),alienSprite('#ffb3cf'),alienSprite('#ffd166')];
  for(let i=0;i<2;i++){const a=al[Math.floor(r()*3)];x.drawImage(a,6+Math.floor(r()*100),148+Math.floor(r()*14),a.width*2,a.height*2)}
  const sp=playerSprite(color,['down','down','left','right'][Math.floor(r()*4)],Math.floor(r()*2));
  x.drawImage(sp,12+Math.floor(r()*14),122,sp.width*3,sp.height*3);
  if(r()<.75){const k=[STK.heart,STK.star][Math.floor(r()*2)];x.drawImage(k,20+Math.floor(r()*34),104,k.width*2,k.height*2)}
  return c}

  function draw(t){c.fillStyle='#1e1040';c.fillRect(0,0,W,H);c.fillStyle='#9b86d8';st.forEach(([x,y])=>c.fillRect(x,y,1,1));

      c.fillStyle='#bba5ea';c.fillRect(h.x-11,h.y+1,22,1)});
    c.font='8px Jua, sans-serif';c.textAlign='center';pops.forEach(p=>{c.fillStyle=p.v>0?'#2a9d78':'#d94a72';c.fillText((p.v>0?'+':'')+p.v,p.x,p.y)});

  cvs.addEventListener('pointerdown',e=>{if(!run)return;const r=cvs.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;

const pubUrl=p=>`${SB_URL}/storage/v1/object/public/${BUCKET}/${p}`;
function errMsg(e){const s=String(e&&(e.message||e.code)||e||'');
  if(/rate_limited/.test(s))return'조금 천천히 올려 주세요. 1분 뒤에 다시 해 볼까요?';
  if(/daily_limit/.test(s))return'오늘 올릴 수 있는 만큼 다 올렸어요. 내일 또 와 주세요!';
  if(/storage_full/.test(s))return'이 기기 저장 공간이 꽉 찼어요';
  if(/check constraint|violates/.test(s))return'글자 수를 확인해 주세요';
  return'전송하지 못했어요. 잠시 뒤에 다시 해 주세요'}
function dataBlob(u){const[h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5).split(';')[0]})}

function captchaToken(){if(!TURNSTILE_KEY)return Promise.resolve(undefined);
  return new Promise(res=>{const go=()=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30';document.body.append(d);
      window.turnstile.render(d,{sitekey:TURNSTILE_KEY,callback:t=>{res(t);setTimeout(()=>d.remove(),800)},'error-callback':()=>{res(undefined);d.remove()}})};
    if(window.turnstile)return go();const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;s.onload=go;s.onerror=()=>res(undefined);document.head.append(s)})}

async function sbInit(){if(!SB_URL||!SB_KEY||!window.supabase)return;
  try{const c=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    let{data:{session}}=await c.auth.getSession();
    if(!session){const{data,error}=await c.auth.signInAnonymously({options:{captchaToken:await captchaToken()}});if(error)throw error;session=data.session}
    sb=c;uid=session.user.id;SEND_MS=700;await pull(true)}
  catch(e){console.warn('Supabase에 연결하지 못해서 이 기기 저장으로 동작해요',e);sb=null}}
const sbReady=sbInit();

/* 서버에서 목록 불러오기 (공개된 것 + 내가 올린 것) + 운영진이 저장한 생카 설정 */
async function pull(force){if(!sb)return;const now=Date.now();if(!force&&now-R.at<15000)return;R.at=now;
  const sel=(t,c)=>sb.from(t).select(c).order('created_at',{ascending:false}).limit(300);
  const[n,g,m,p,l,st]=await Promise.all([
    sel('notes','id,user_id,name,message,approved,created_at'),
    sel('gallery_ranked','id,user_id,name,title,reason,image_path,approved,created_at,like_count'),
    sel('montages','id,user_id,name,title,image_path,approved,created_at'),
    sel('photos','id,user_id,name,caption,image_path,approved,created_at'),
    sb.from('likes').select('item_type,item_id').eq('user_id',uid),
    sb.from('site_settings').select('data').eq('id',1).maybeSingle()]);
  if(!st.error&&st.data&&st.data.data)Object.assign(ARCHIVE,st.data.data);
  [n,g,m,p].forEach(r=>{if(!r.error)r.data=r.data.filter(x=>x.approved||x.user_id===uid)});
  const base=x=>({id:x.id,n:x.name,mine:x.user_id===uid,pending:!x.approved,at:Date.parse(x.created_at)});
  if(!n.error)R.notes=n.data.map(x=>({...base(x),m:x.message,t:Date.parse(x.created_at)}));
  if(!g.error)R.gallery=g.data.map(x=>({...base(x),t:x.title,w:x.reason,img:pubUrl(x.image_path),path:x.image_path,likes:x.like_count||0}));
  if(!m.error)R.montages=m.data.map(x=>({...base(x),t:x.title,img:pubUrl(x.image_path),path:x.image_path}));
  if(!p.error)R.photos=p.data.map(x=>({...base(x),t:x.caption,img:pubUrl(x.image_path),path:x.image_path}));
  if(!l.error)R.liked=new Set(l.data.map(x=>x.item_type+':'+x.item_id))}
setInterval(()=>{if(sb)pull()},45000);

/* 목록 = 서버가 있으면 서버, 없으면 이 기기 + 예시 */
const LS={notes:'jc_notes',gallery:'jc_gallery',montages:'jc_montages',photos:'jc_photos'};

  if(k==='montages')return monExamples();
  if(k==='photos')return photoEx();return[]}
const itemsOf=k=>sb?R[k]:[...localList(k),...exList(k)];

/* 올리기 · 내리기 */
async function addItem(k,d){
  if(!sb){const a=store.get(LS[k],[]),id='l'+Date.now();a.push(k==='notes'?{id,n:d.n,m:d.m,t:Date.now()}:{id,...d});
    try{localStorage.setItem(LS[k],JSON.stringify(a))}catch(e){throw new Error('storage_full')}return}
  let path=null;
  if(d.img){const blob=dataBlob(d.img),ext=blob.type==='image/png'?'png':'jpg';path=`${uid}/${k}-${Date.now()}.${ext}`;
    const up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type,cacheControl:'31536000',upsert:false});if(up.error)throw up.error}
  const row=k==='notes'?{name:d.n,message:d.m}:k==='gallery'?{name:d.n,title:d.t,reason:d.w,image_path:path}:k==='montages'?{name:d.n,title:d.t,image_path:path}:{name:d.n,caption:d.t,image_path:path};
  const r=await sb.from(k).insert(row).select().single();
  if(r.error){if(path)sb.storage.from(BUCKET).remove([path]);throw r.error}
  const x=r.data,b={id:x.id,n:x.name,mine:true,pending:!x.approved,at:Date.parse(x.created_at)};
  R[k].unshift(k==='notes'?{...b,m:x.message,t:b.at}:{...b,t:d.t,w:d.w,img:d.img,path,likes:0})}
async function removeItem(k,e){
  if(!sb){store.set(LS[k],store.get(LS[k],[]).filter((x,i)=>(k==='notes'?(x.id||'n'+(x.t||i)):x.id)!==e.id));return}
  const r=await sb.from(k).delete().eq('id',e.id);if(r.error)throw r.error;
  if(e.path)sb.storage.from(BUCKET).remove([e.path]);R[k]=R[k].filter(x=>x.id!==e.id)}

/* 좋아요 (사진관 · 교신) */
const LK={gallery:'jc_likes',notes:'jc_nlikes'};
const isLiked=(k,id)=>sb?R.liked.has(k+':'+id):!!store.get(LK[k],{})[id];
async function toggleLike(k,e){const on=isLiked(k,e.id);
  if(!sb){const l=store.get(LK[k],{});l[e.id]=!on;store.set(LK[k],l);return}
  const r=on?await sb.from('likes').delete().match({item_type:k,item_id:e.id,user_id:uid}):await sb.from('likes').insert({item_type:k,item_id:e.id});
  if(r.error&&r.error.code!=='23505')throw r.error;
  if(on)R.liked.delete(k+':'+e.id);else R.liked.add(k+':'+e.id);
  const it=R[k].find(x=>x.id===e.id);if(it&&typeof it.likes==='number')it.likes=Math.max(0,it.likes+(on?-1:1))}

/* 맵 실시간 접속: 서버가 있으면 Supabase Realtime, 없으면 Claude 미리보기의 room */
function startNet(){if(netStarted)return;netStarted=true;$('#rpBtn').hidden=false;sbReady.then(()=>sb?startSbRoom():startClaudeRoom())}
async function startSbRoom(){
  for(let i=1;i<=40;i++){let active=false;const ch=sb.channel('planet-1203-'+i,{config:{presence:{key:uid},broadcast:{self:false}}});
    sbRoomHandlers(ch,()=>active);
    const ok=await new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};
      ch.subscribe(async st=>{if(st==='SUBSCRIBED'){try{await ch.track({n:me.name,c:me.color})}catch(e){}setTimeout(()=>fin(true),700)}
        else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')fin(false)});
      setTimeout(()=>fin(false),8000)});
    if(!ok){sb.removeChannel(ch);return}                        // 실시간 연결이 안 되면 혼자 탐험해요
    if(Object.keys(ch.presenceState()).length>ROOM_SIZE){await sb.removeChannel(ch);continue}   // 꽉 찼으면 다음 행성으로
    active=true;roomNo=i;netCh=ch;
    for(let j=npcs.length-1;j>=0;j--)if(!npcs[j].alien)npcs.splice(j,1); // 진짜 대원이 들어오니 예시 대원은 뺌
    netSend={pos:o=>ch.send({type:'broadcast',event:'p',payload:{...o,k:uid}}),chat:o=>ch.send({type:'broadcast',event:'c',payload:{say:o.say,n:me.name,k:uid}})};
    lastPres='';ch.presenceState&&sbSync(ch);
    if(i>1)addLog('안내',`사람이 많아서 행성 #1203-${i}에 착륙했어요`,false);
    return}}
function sbSync(ch){const st=ch.presenceState(),now=Date.now();online=Math.max(1,Object.keys(st).length);$('#online').textContent=online;
  remotes.forEach((r,k)=>{if(!st[k]&&now-(r.seen||0)>5000)remotes.delete(k)})}
function sbRoomHandlers(ch,isActive){
  ch.on('presence',{event:'sync'},()=>{if(isActive())sbSync(ch)})
    .on('presence',{event:'join'},({key})=>{if(isActive()&&key!==uid)lastPres=''})   // 새로 온 대원에게 내 위치를 다시 알려 줌
    .on('broadcast',{event:'p'},({payload:pr})=>{if(!isActive()||!pr||pr.k===uid||typeof pr.x!=='number'||typeof pr.y!=='number')return;
      let r=remotes.get(pr.k);if(!r){r={x:pr.x,y:pr.y,dir:'down',walk:false,frame:0,ft:0,say:'',sayT:0};remotes.set(pr.k,r)}
      r.seen=Date.now();r.tx=Math.max(0,Math.min(WW,pr.x));r.ty=Math.max(0,Math.min(WH,pr.y));r.face=DL[pr.d]||'down';
      r.name=clean(pr.n,10)||'대원';r.color=typeof pr.c==='string'&&/^#[0-9a-f]{6}$/i.test(pr.c)?pr.c:'#ff6f91'})
    .on('broadcast',{event:'c'},({payload:pr})=>{if(!isActive()||!pr)return;const tx=clean(pr.say,40);if(!tx)return;
      const r=remotes.get(pr.k);if(r){r.say=tx;r.sayT=300}addLog(clean(pr.n,10)||'대원',tx,false)})}

const loadImg=src=>new Promise(r=>{const im=new Image();if(/^https?:/.test(src))im.crossOrigin='anonymous';im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src});
function wrapLines(x,text,maxW,max){const L=[];let line='';for(const ch of[...text.replace(/\s+/g,' ')]){if(x.measureText(line+ch).width>maxW&&line){L.push(line);line=ch}else line+=ch}if(line)L.push(line);
  if(L.length>max){L.length=max;L[max-1]=L[max-1].slice(0,-1)+'…'}return L}
async function coverCard(){
  try{await Promise.all(['700 60px Gaegu','40px Jua','30px "Gowun Dodum"'].map(f=>document.fonts.load(f)))}catch(e){}
  const s=myStats(),W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const[ufo,mon,ap]=await Promise.all([loadImg(ART.ufo),loadImg(s.mon?s.mon.img:zzuImg()),loadImg(ART.ap)]);
  const HAND=(w,sz)=>`${w} ${sz}px Gaegu, cursive`,BODY=sz=>`${sz}px "Gowun Dodum", sans-serif`;
  x.fillStyle='#fdf7f1';x.fillRect(0,0,W,H);x.textAlign='left';x.textBaseline='alphabetic';
  x.fillStyle='#6a4fc0';x.font='38px Jua, sans-serif';x.fillText('행성 #1203',70,92);
  x.fillStyle='#6a5d8f';x.font=BODY(26);x.fillText('쭈일리언 생일 탐사 · 주은 생일카페',70,134);
  const px=60,py=180,pw=W-120,ph=1090;
  rr(x,px,py,pw,ph,36);x.fillStyle='#fff';x.fill();
  x.save();rr(x,px,py,pw,ph,36);x.clip();x.fillStyle='#ece4fa';for(let i=px;i<px+pw;i+=40)x.fillRect(i,py,2,ph);for(let j=py;j<py+ph;j+=40)x.fillRect(px,j,pw,2);x.restore();
  x.strokeStyle='#d9c9f3';x.lineWidth=4;rr(x,px,py,pw,ph,36);x.stroke();
  const tape=(cx,cy,w,rot,col)=>{x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha=.85;x.fillStyle=col;x.fillRect(-w/2,-20,w,40);x.restore()};
  tape(W-260,py,150,.07,'#b9e8c8');
  if(ufo){const w=210,h=w*ufo.height/ufo.width;x.save();x.translate(W-170,100);x.rotate(.1);x.drawImage(ufo,-w/2,-h/2,w,h);x.restore()}
  let fs=74;const title=s.name+' 대원의 탐사 일지';x.font=HAND(700,fs);while(x.measureText(title).width>pw-110&&fs>40){fs-=4;x.font=HAND(700,fs)}
  x.fillStyle='#2a1d4d';x.fillText(title,110,300);
  x.fillStyle='#6a5d8f';x.font=BODY(28);x.fillText(`대원 번호 1203-${s.no} · ${s.landStr} 착륙`,110,352);
  x.save();x.translate(330,620);x.rotate(-.07);x.shadowColor='rgba(42,29,77,.18)';x.shadowBlur=24;x.shadowOffsetY=6;x.fillStyle='#fff';x.fillRect(-190,-210,380,450);x.restore();
  x.save();x.translate(330,620);x.rotate(-.07);x.fillStyle='#f4effc';x.fillRect(-170,-190,340,340);
  if(mon){x.imageSmoothingEnabled=false;const k=Math.min(340/mon.width,340/mon.height),w=mon.width*k,h=mon.height*k;x.drawImage(mon,-w/2,-20-h/2,w,h)}
  x.fillStyle='#2a1d4d';x.font=HAND(700,36);x.textAlign='center';x.fillText(s.mon?s.mon.t:'내 몽타주',0,205);x.restore();x.textAlign='left';
  tape(320,400,130,-.12,'#f7a8c4');
  if(ap){x.save();x.imageSmoothingEnabled=false;x.translate(505,830);x.rotate(.17);const w=110;x.drawImage(ap,-w/2,-w/2,w,w*ap.height/ap.width);x.restore()}
  [[`${doneCount()}/5`,' 교신 해독'],[`${s.best}점`,' 외계인 수색'],[s.mins?`${s.mins}분`:'—',' 탐사']].forEach(([a,b],i)=>{const y=500+i*90;x.font=HAND(700,52);x.fillStyle='#ff6f91';x.fillText(a,600,y);const w=x.measureText(a).width;x.font=HAND(400,48);x.fillStyle='#2a1d4d';x.fillText(b,600+w,y)});
  rr(x,110,890,860,190,28);x.fillStyle='#f4effc';x.fill();
  x.fillStyle='#6a5d8f';x.font=BODY(26);x.fillText('내가 남긴 교신',145,940);
  x.fillStyle='#2a1d4d';x.font=HAND(700,40);wrapLines(x,s.note||'아직 남긴 교신이 없어요',790,2).forEach((l,i)=>x.fillText(l,145,998+i*50));
  if(s.gal){x.fillStyle='#2a1d4d';x.font=BODY(30);const t=wrapLines(x,`사진관에 「${s.gal.t}」 사진을 걸었어요`,860,1)[0];x.fillText(t,110,1145)}
  x.save();x.translate(W-110,1225);x.rotate(-.03);x.fillStyle='#6a4fc0';x.font=HAND(700,46);x.textAlign='right';x.fillText('주은아 생일 축하해!',0,0);x.restore();
  x.fillStyle='#9a8db0';x.font=BODY(22);x.textAlign='center';x.fillText(`PLANET #1203 · ${ARCHIVE.tag}`,W/2,1322);
  return c.toDataURL('image/png')}
function showCard(u,msg){openSheet('내 탐사 일지',`<img class="out" id="rpCard" src="${u}" alt="탐사 일지 이미지" style="image-rendering:auto">${msg?`<p>${msg}</p>`:''}${saveUI('rpCard','1203-탐사일지.png')}`)}
async function shareCard(){const u=await coverCard();
  try{const f=new File([dataBlob(u)],'1203-탐사일지.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'행성 #1203 탐사 일지',text:ARCHIVE.tag});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  showCard(u,`이 화면에서는 바로 공유가 안 돼서 이미지로 저장해 올려 주세요. ${escH(ARCHIVE.tag)}`)}

rp.addEventListener('click',async e=>{const b=e.target.closest('[data-go],[data-act]');if(!b||!rp.contains(b))return;
  if(b.dataset.go){rpShow(b.dataset.go);return}
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==='close')closeReport();
  else if(a==='play')playEdit(i);
  else if(a==='save'){b.disabled=true;try{showCard(await coverCard())}finally{b.disabled=false}}
  else if(a==='share'){b.disabled=true;try{await shareCard()}finally{b.disabled=false}}
  else if(a==='comm'){const list=ARCHIVE.commissions.filter(c=>c.img),c=ARCHIVE.commissions[i];
    if(!c||!c.img){openSheet('JOONI GALLERY','<p>커미션 작품을 준비하고 있어요.</p>');return}
    openViewer({items:list,index:list.indexOf(c),ratio:'3/4',title:c=>c.title,img:c=>c.img,alt:c=>c.title,back:closeSheet,body:c=>`<p class="by">illust. ${escH(c.artist)}</p>`})}
  else if(a==='mon')openViewer({items:rpMons(),index:i,ratio:'1',pixel:true,title:m=>m.t,img:m=>m.img,alt:m=>m.t,back:closeSheet,body:m=>`<p class="by">그린 대원 · ${escH(m.n)}${m.ex?' · 예시 작품':''}</p>`})
  else if(a==='top')galView(rpTop(),i);
  else if(a==='gal')galView(rpGallery(),i);
  else if(a==='shot')openViewer({items:rpShots(),index:i,ratio:'9/16',title:p=>p.t,img:p=>p.img,alt:p=>p.t,back:closeSheet,body:p=>`<p class="by">찍은 대원 · ${escH(p.n)}${p.ex?' · 예시 사진':''}</p>`});
  else if(a==='shop')openShop();
  else if(a==='scroll'){const t=$('#rpFan');if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='tab'){rpTab=b.dataset.k;rpRefresh()}
  else if(a==='like'){const n=rpNotes().find(x=>x.id===b.dataset.id);if(n){b.disabled=true;toggleLike('notes',n).then(rpRefresh,()=>{b.disabled=false})}}
  else if(a==='guest'){openGuest();onClose=()=>setTimeout(rpRefresh,0)}
});

rp.addEventListener('dragstart',e=>{if(e.target.closest('.rp-row'))e.preventDefault()});
rp.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;const row=e.target.closest('.rp-row');if(!row)return;
  const sx=e.clientX,sl=row.scrollLeft;let moved=false;
  const mv=ev=>{const dx=ev.clientX-sx;if(!moved&&Math.abs(dx)>5){moved=true;row.classList.add('drag');row.style.scrollSnapType='none'}if(moved)row.scrollLeft=sl-dx};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);row.classList.remove('drag');row.style.scrollSnapType='';
    if(moved){const kill=ev=>{ev.stopPropagation();ev.preventDefault()};row.addEventListener('click',kill,{capture:true,once:true});setTimeout(()=>row.removeEventListener('click',kill,{capture:true}),0)}};
  addEventListener('pointermove',mv);addEventListener('pointerup',up)});

const ytId=v=>{v=String(v||'').trim();if(/^[\w-]{11}$/.test(v))return v;const m=v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:''};

async function isAdmin(){if(!sb)return false;const{data:{session}}=await sb.auth.getSession();if(!session||session.user.is_anonymous)return false;

async function openAdmin(){AD.open=true;held.length=0;adm.hidden=false;adm.innerHTML='<div class="adw"><p class="ad-empty">불러오는 중…</p></div>';

async function adGo(tab){AD.tab=tab;AD.msg='';

  if(tab==='site')return adSite();if(tab==='stats')return adStats();
  const r=await sb.from(tab==='gallery'?'gallery_ranked':tab).select(AD_COLS[tab]).order('created_at',{ascending:false}).limit(500);
  if(r.error){$('#adBody').innerHTML=`<p class="ad-err">불러오지 못했어요: ${escH(r.error.message)}</p>`;return}

    else if(el.dataset.f==='lastAtLocal'){const v=el.value;if(v){const[dt,tm]=v.split('T'),[y,mo,d]=dt.split('-').map(Number),[h,mi]=tm.split(':').map(Number);S.lastAt=Date.UTC(y,mo-1,d,h-9,mi)}}
    else if(el.dataset.f)S[el.dataset.f]=el.value});
  f.addEventListener('change',async e=>{const el=e.target;if(!el.dataset.up||!el.files[0])return;const lab=el.parentElement;lab.firstChild.textContent='올리는 중…';
    try{const url=await adUpload(el.files[0]);if(el.dataset.up==='hero')S.heroImg=url;else S.commissions[+el.dataset.i].img=url;adSiteRender(upd)}
    catch(err){lab.firstChild.textContent='실패, 다시 시도';alert('사진을 올리지 못했어요: '+(err.message||err))}});
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('.ad-pri');b.disabled=true;$('#adSaveMsg').textContent='저장 중…';
    const data={heroImg:S.heroImg||null,heroCredit:S.heroCredit,tag:S.tag,lastAt:S.lastAt,lastMsg:S.lastMsg,
      edits:S.edits.map(x=>({title:x.title||'',by:x.by||'',yt:ytId(x.yt),len:x.len||''})),
      commissions:S.commissions.map(x=>({img:x.img||null,title:x.title||'',artist:x.artist||''}))};
    const r=await sb.from('site_settings').update({data,updated_at:new Date().toISOString()}).eq('id',1);b.disabled=false;
    if(r.error){$('#adSaveMsg').textContent='저장하지 못했어요: '+r.error.message;return}
    Object.assign(ARCHIVE,data);$('#adSaveMsg').textContent='저장했어요! 대원들이 새로고침하면 바로 보여요'}}
async function adUpload(file){const im=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)});
  const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const blob=dataBlob(c.toDataURL('image/jpeg',.86)),path=`site/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
  const up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;return pubUrl(path)}

  const T=[['notes','교신'],['gallery','사진관'],['montages','몽타주'],['photos','인증샷']];

  const lk=await sb.from('likes').select('item_id',{count:'exact',head:true});
  $('#adBody').innerHTML=`<div class="ad-stats">${T.map(([t,l],i)=>`<div><small>${l}</small><b>${res[i*2].count??'-'}</b><span>오늘 +${res[i*2+1].count??'-'}</span></div>`).join('')}
    <div><small>공감</small><b>${lk.count??'-'}</b><span>전체</span></div><div><small>내가 들어간 행성</small><b>#1203-${roomNo}</b><span>${online}명 접속</span></div></div>
    <p class="ad-note">맵은 행성마다 ${ROOM_SIZE}명씩 나눠 들어가요. 전체 실시간 접속자 수는 Supabase 대시보드 → Realtime → Inspector 에서 볼 수 있어요.</p>
    <button class="ad-add" data-ad="tab" data-k="stats">새로고침</button>`}

adm.addEventListener('click',e=>{const b=e.target.closest('[data-ad]');if(!b)return;const a=b.dataset.ad;
  if(a==='close')closeAdmin();else if(a==='logout')adLogout();else if(a==='tab'){AD.filter='all';adGo(b.dataset.k)}
  else if(a==='filter'){AD.filter=b.dataset.k;adList()}else if(a==='toggle')adToggle(b.dataset.id);else if(a==='del')adDel(b.dataset.id,b);
  else if(a==='add'){AD.site[b.dataset.l].push(b.dataset.l==='edits'?{title:'',by:'',yt:'',len:''}:{img:null,title:'',artist:''});adSiteRender()}
  else if(a==='rm'){AD.site[b.dataset.l].splice(+b.dataset.i,1);adSiteRender()}
  else if(a==='up'){const L=AD.site[b.dataset.l],i=+b.dataset.i;if(i>0){[L[i-1],L[i]]=[L[i],L[i-1]];adSiteRender()}}});

const OPEN=Date.UTC(2026,11,3,3,3),CLOSE=Date.UTC(2026,11,17,15,0);
function tick(){const n=Date.now(),el=$('#dday');
  if(n<OPEN){const d=OPEN-n,dd=Math.floor(d/864e5),h=Math.floor(d/36e5)%24,m=Math.floor(d/6e4)%60,ss=Math.floor(d/1e3)%60;
    el.innerHTML=`착륙까지 <b>D-${dd}</b> ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
  else el.innerHTML=n<CLOSE?'<b>행성 개방 중</b>':'탐사 종료 · 고마워요'}
